<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<style>

body {
    background: #f4f7fc;
    font-family: 'Segoe UI', sans-serif;
}

.navbar {
    background: #1e3a8a;
}

.navbar-brand {
    color: white;
    font-weight: bold;
}

.navbar-brand:hover {
    color: white;
}

.form-card {
    max-width: 650px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.08);
}

.page-title {
    font-weight: 700;
    color: #1e293b;
}

.form-control {
    border-radius: 8px;
    padding: 10px;
}

.btn {
    border-radius: 8px;
}

</style>

</head>

<body>


<!-- Navbar -->

<nav class="navbar">

<div class="container-fluid">

<a class="navbar-brand"
   th:href="@{/dashboard}">

<i class="bi bi-mortarboard-fill"></i>

Student Management System

</a>

<a th:href="@{/students}"
   class="btn btn-light">

<i class="bi bi-arrow-left"></i>

Back to Students

</a>

</div>

</nav>


<!-- Form -->

<div class="container">

<div class="form-card">

<h2 class="page-title text-center mb-4">

<i class="bi bi-pencil-square text-primary"></i>

Edit Student

</h2>


<form th:action="@{/editStudent/{id}(id=${student.id})}"
      th:object="${student}"
      method="post">


<!-- Name -->

<div class="mb-3">

<label class="form-label">

Student Name

</label>

<input type="text"
       th:field="*{name}"
       class="form-control"
       required>

</div>


<!-- Email -->

<div class="mb-3">

<label class="form-label">

Email

</label>

<input type="email"
       th:field="*{email}"
       class="form-control"
       required>

</div>


<!-- Department -->

<div class="mb-3">

<label class="form-label">

Department

</label>

<input type="text"
       th:field="*{department}"
       class="form-control"
       required>

</div>


<!-- City -->

<div class="mb-3">

<label class="form-label">

City

</label>

<input type="text"
       th:field="*{city}"
       class="form-control"
       required>

</div>


<!-- Phone -->

<div class="mb-3">

<label class="form-label">

Phone

</label>

<input type="text"
       th:field="*{phone}"
       class="form-control"
       required>

</div>


<!-- Buttons -->

<div class="d-flex gap-2">

<a th:href="@{/students}"
   class="btn btn-secondary w-50">

Cancel

</a>

<button type="submit"
        class="btn btn-primary w-50">

<i class="bi bi-check-circle"></i>

Update Student

</button>

</div>


</form>

</div>

</div>

</body>

</html>

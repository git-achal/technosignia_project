<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#1e3a8a;
}

.navbar-brand{
    color:white;
    font-weight:bold;
}

.navbar-brand:hover{
    color:white;
}

.page-title{
    font-weight:700;
    color:#1e293b;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 10px 25px rgba(0,0,0,.08);
}

.table thead{
    background:#2563eb;
    color:white;
}

.table tbody tr:hover{
    background:#eef4ff;
}

.search-box{
    max-width:350px;
}

.btn{
    border-radius:8px;
}

.badge{
    font-size:14px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand" href="/dashboard">

<i class="bi bi-mortarboard-fill"></i>

Student Management System

</a>

<div>

<a href="/dashboard" class="btn btn-light me-2">

<i class="bi bi-house-door-fill"></i>

Dashboard

</a>

<a href="/logout" class="btn btn-danger">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</div>

</div>

</nav>

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="page-title">

<i class="bi bi-people-fill text-primary"></i>

Students List

</h2>

<a href="/addStudent" class="btn btn-success">

<i class="bi bi-person-plus-fill"></i>

Add Student

</a>

</div>

<div class="row mb-4">

    <div class="col-md-8">

        <form th:action="@{/students/search}"
              method="get"
              class="d-flex gap-2">

            <input
                type="text"
                name="keyword"
                class="form-control search-box"
                placeholder="Search by name, email, department or city..."
                required>

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-search"></i>
                Search

            </button>

            <a th:href="@{/students}"
               class="btn btn-secondary">

                <i class="bi bi-arrow-clockwise"></i>
                Reset

            </a>

        </form>

    </div>

</div>
<div class="col-md-4">

    <form th:action="@{/students}"
          method="get"
          class="d-flex gap-2">

        <select name="sortBy"
                class="form-select">

            <option value="id"
                    th:selected="${sortBy == 'id'}">
                Sort by ID
            </option>

            <option value="name"
                    th:selected="${sortBy == 'name'}">
                Sort by Name
            </option>

            <option value="email"
                    th:selected="${sortBy == 'email'}">
                Sort by Email
            </option>

            <option value="department"
                    th:selected="${sortBy == 'department'}">
                Sort by Department
            </option>

            <option value="city"
                    th:selected="${sortBy == 'city'}">
                Sort by City
            </option>

        </select>

        <select name="direction"
                class="form-select">

            <option value="asc"
                    th:selected="${direction == 'asc'}">
                Ascending
            </option>

            <option value="desc"
                    th:selected="${direction == 'desc'}">
                Descending
            </option>

        </select>

        <input type="hidden"
               name="size"
               th:value="${size}">

        <button type="submit"
                class="btn btn-primary">

            <i class="bi bi-sort-down"></i>

        </button>

    </form>

</div>
<div class="card">

<div class="card-body">

<table class="table table-hover align-middle" id="studentTable">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>City</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>

<td th:text="${student.name}"></td>

<td th:text="${student.email}"></td>

<td th:text="${student.department}"></td>

<td th:text="${student.city}"></td>

<td>

<span class="badge bg-success">

Active

</span>

</td>

<td>

    <!-- EDIT BUTTON -->
    <a th:href="@{/editStudent/{id}(id=${student.id})}"
       class="btn btn-warning btn-sm me-1">

        <i class="bi bi-pencil-square"></i>

    </a>


    <!-- DELETE BUTTON -->
    <form th:action="@{/deleteStudent/{id}(id=${student.id})}"
          method="post"
          style="display:inline;">

        <button type="submit"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Are you sure you want to delete this student?');">

            <i class="bi bi-trash-fill"></i>

        </button>

    </form>

</td>

</tr>

</tbody>

</table>

</div>

</div>
<!-- PAGINATION -->

<div class="d-flex justify-content-between align-items-center mt-4">

    <div>

        <small class="text-muted">

            Total Students:

            <strong th:text="${totalItems}">0</strong>

        </small>

    </div>


    <nav th:if="${totalPages > 0}">

        <ul class="pagination mb-0">

            <!-- PREVIOUS -->

            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${currentPage - 1},
                       size=${size},
                       sortBy=${sortBy},
                       direction=${direction}
                   )}">

                    Previous

                </a>

            </li>


            <!-- PAGE NUMBERS -->

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${pageNumber},
                       size=${size},
                       sortBy=${sortBy},
                       direction=${direction}
                   )}"
                   th:text="${pageNumber + 1}">

                    1

                </a>

            </li>


            <!-- NEXT -->

            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${currentPage + 1},
                       size=${size},
                       sortBy=${sortBy},
                       direction=${direction}
                   )}">

                    Next

                </a>

            </li>

        </ul>

    </nav>

</div>

</div>



</body>
</html>

<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Contract Detail</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-4"><h2 th:text="${contract.contractName}"></h2><p><b>Party:</b> <span th:text="${contract.partyName}"></span> | <b>Status:</b> <span th:text="${contract.status}"></span></p><p th:text="${contract.description}"></p><hr><h4>Upload Document</h4><form id="up" enctype="multipart/form-data" class="mb-4"><input id="file" type="file" class="form-control mb-2" required><button class="btn btn-primary">Upload</button></form><h4>Documents</h4><table class="table table-bordered bg-white"><thead><tr><th>File</th><th>Uploaded By</th><th>Date</th><th>Download</th></tr></thead><tbody id="docs"></tbody></table><h4 class="mt-4">Version History</h4><table class="table table-bordered bg-white"><thead><tr><th>Version</th><th>Changed By</th><th>Date</th><th>Status</th></tr></thead><tbody id="vers"></tbody></table><a href="/contracts">Back</a></div><script>const id='[[${contract.id}]]';async function load(){let d=await (await fetch('/api/contracts/'+id+'/documents')).json();docs.innerHTML=d.map(x=>`<tr><td>${x.fileName}</td><td>${x.uploadedBy}</td><td>${x.uploadedAt}</td><td><a href="/api/contracts/documents/${x.id}">Download</a></td></tr>`).join('');let v=await (await fetch('/api/contracts/'+id+'/versions')).json();vers.innerHTML=v.map(x=>`<tr><td>${x.versionNumber}</td><td>${x.changedBy}</td><td>${x.changedAt}</td><td>${x.status}</td></tr>`).join('')}up.onsubmit=async e=>{e.preventDefault();let fd=new FormData();fd.append('file',file.files[0]);let r=await fetch('/api/contracts/'+id+'/documents',{method:'POST',body:fd});if(!r.ok)alert('Upload failed');else load()};load();</script></body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/auth.css}">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

    <!-- Left Panel -->
    <div class="col-lg-6 left-side d-none d-lg-flex">

        <div class="text-center text-white">

            <i class="bi bi-person-workspace display-icon"></i>

            <h1 class="fw-bold mt-4">
                Welcome Back
            </h1>

            <p class="lead">
                Login to access your Student Management Dashboard
            </p>

        </div>

    </div>

    <!-- Right Panel -->

    <div class="col-lg-6 d-flex justify-content-center align-items-center">

        <div class="register-card">

            <div class="text-center mb-4">

                <i class="bi bi-person-circle text-primary" style="font-size:65px;"></i>

                <h2 class="mt-2">
                    Sign In
                </h2>

                <p class="text-muted">
                    Please login to continue
                </p>

            </div>

            <!-- Success Message -->

            <div class="alert alert-success"
                 th:if="${success}"
                 th:text="${success}">
            </div>

            <!-- Error Message -->

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <form action="/login" method="post">

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-envelope-fill"></i>

                        Email Address

                    </label>

                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-lock-fill"></i>

                        Password

                    </label>

                    <div class="input-group">

                        <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter Password"
                                required>

                        <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword()">

                            <i id="eyeIcon"
                               class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox">

                        <label class="form-check-label">

                            Remember Me

                        </label>

                    </div>

                    <a href="#" class="text-decoration-none">

                        Forgot Password?

                    </a>

                </div>

                <button class="btn btn-primary w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>

            <hr>

            <div class="text-center">

                Don't have an account?

                <a href="/register">

                    Register Here

                </a>

            </div>

        </div>

    </div>

</div>

</div>

<script>

function togglePassword(){

let password=document.getElementById("password");

let eye=document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";

eye.classList.remove("bi-eye");

eye.classList.add("bi-eye-slash");

}
else{

password.type="password";

eye.classList.remove("bi-eye-slash");

eye.classList.add("bi-eye");

}

}

</script>

</body>
</html>

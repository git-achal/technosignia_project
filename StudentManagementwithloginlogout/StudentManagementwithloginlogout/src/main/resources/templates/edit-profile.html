<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentMS | Update Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #1e3a8a;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: white;
        }

        .profile-card {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-heading i {
            font-size: 45px;
            color: #2563eb;
        }

        .page-heading h2 {
            margin-top: 10px;
            color: #1e293b;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 11px 25px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-mortarboard-fill"></i>

            Student Management System

        </a>

        <div>

            <a th:href="@{/profile}"
               class="btn btn-light me-2">

                <i class="bi bi-person"></i>

                Profile

            </a>

            <a th:href="@{/logout}"
               class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- UPDATE PROFILE -->

<div class="container">

    <div class="profile-card">

        <div class="page-heading">

            <i class="bi bi-person-gear"></i>

            <h2>Update Profile</h2>

            <p class="text-muted">
                Update your account information
            </p>

        </div>


        <form th:action="@{/profile/update}"
              method="post">


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">

                    Full Name

                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       th:value="${user.name}"
                       required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">

                    Email

                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       th:value="${user.email}"
                       required>

            </div>


            <!-- BUTTONS -->

            <div class="d-flex justify-content-between mt-4">

                <a th:href="@{/profile}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-lg"></i>

                    Save Changes

                </button>

            </div>


        </form>

    </div>

</div>

</body>

</html>

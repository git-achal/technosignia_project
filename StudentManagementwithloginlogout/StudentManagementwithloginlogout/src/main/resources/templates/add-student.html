<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Student</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #1e3a8a;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .navbar-brand:hover {
            color: white;
        }

        .page-container {
            margin-top: 50px;
        }

        .form-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            font-weight: 700;
            color: #1e293b;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="/dashboard">

            <i class="bi bi-mortarboard-fill"></i>

            Student Management System

        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-light me-2">

                <i class="bi bi-house-door-fill"></i>

                Dashboard

            </a>

            <a href="/students"
               class="btn btn-info me-2 text-white">

                <i class="bi bi-people-fill"></i>

                Students

            </a>

            <a href="/logout"
               class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container page-container">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10">


            <!-- PAGE TITLE -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="page-title">

                    <i class="bi bi-person-plus-fill text-primary"></i>

                    Add New Student

                </h2>

            </div>


            <!-- FORM CARD -->

            <div class="form-card">


                <!-- IMPORTANT:
                     student object must be available
                     in PageController -->

                <form th:action="@{/addStudent}"
                      th:object="${student}"
                      method="post">


                    <!-- NAME -->

                    <div class="mb-3">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter student name"
                               required>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">

                            Email Address

                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter email address"
                               required>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="mb-3">

                        <label class="form-label">

                            Department

                        </label>

                        <select th:field="*{department}"
                                class="form-control"
                                required>

                            <option value="">

                                Select Department

                            </option>

                            <option value="Computer Science">

                                Computer Science

                            </option>

                            <option value="Information Technology">

                                Information Technology

                            </option>

                            <option value="ENTC">

                                ENTC

                            </option>

                            <option value="Mechanical">

                                Mechanical

                            </option>

                            <option value="Civil">

                                Civil

                            </option>

                            <option value="Electrical">

                                Electrical

                            </option>

                        </select>

                    </div>


                    <!-- CITY -->

                    <div class="mb-3">

                        <label class="form-label">

                            City

                        </label>

                        <input type="text"
                               th:field="*{city}"
                               class="form-control"
                               placeholder="Enter city"
                               required>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-4">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input type="text"
                               th:field="*{phone}"
                               class="form-control"
                               placeholder="Enter phone number"
                               required>

                    </div>


                    <!-- BUTTONS -->

                    <div class="d-flex justify-content-between">

                        <a href="/students"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>

                            Cancel

                        </a>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-person-plus-fill"></i>

                            Add Student

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

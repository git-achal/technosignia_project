<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Create Contract</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div class="container py-5"><h2>Create Contract</h2><form id="f" class="mt-3"><input id="contractName" class="form-control mb-2" placeholder="Contract name" required><input id="partyName" class="form-control mb-2" placeholder="Party name" required><textarea id="description" class="form-control mb-2" placeholder="Description"></textarea><div class="row"><div class="col"><input id="startDate" type="date" class="form-control mb-2"></div><div class="col"><input id="endDate" type="date" class="form-control mb-2"></div></div><select id="status" class="form-select mb-3"><option>DRAFT</option><option>ACTIVE</option><option>EXPIRED</option><option>TERMINATED</option></select><button class="btn btn-primary">Create</button> <a class="btn btn-secondary" href="/contracts">Back</a></form><div id="msg" class="mt-3"></div></div><script>f.onsubmit=async e=>{e.preventDefault();let c={contractName:contractName.value,partyName:partyName.value,description:description.value,startDate:startDate.value||null,endDate:endDate.value||null,status:status.value};let r=await fetch('/api/contracts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});msg.textContent=r.ok?'Created successfully':'Create failed';if(r.ok)setTimeout(()=>location='/contracts',500)};</script></body></html>

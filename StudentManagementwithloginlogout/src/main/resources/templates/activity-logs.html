<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Activity Logs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-4"><div class="d-flex justify-content-between"><h2>Activity Logs</h2><a class="btn btn-success" th:href="@{'/api/audit/csv?q='+${q}}">Export CSV</a></div><form class="row g-2 my-3"><div class="col-md-9"><input name="q" th:value="${q}" class="form-control" placeholder="Search action, user or entity"></div><div class="col-md-3"><button class="btn btn-dark w-100">Search</button></div></form><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Action</th><th>User</th><th>Date & Time</th><th>Entity</th><th>ID</th><th>Details</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${l.action}"></td><td th:text="${l.userEmail}"></td><td th:text="${l.actionTime}"></td><td th:text="${l.entityType}"></td><td th:text="${l.entityId}"></td><td th:text="${l.details}"></td></tr></tbody></table></div><a href="/dashboard">Dashboard</a></div></body></html>

<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contracts</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2>Contract Management</h2><a class="btn btn-primary" href="/contracts/new">Create Contract</a></div><form class="row g-2 mb-3"><div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search contract name"></div><div class="col-md-3"><select class="form-select" name="status"><option value="">All Status</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==status}"></option></select></div><div class="col-md-3"><button class="btn btn-dark">Search / Filter</button></div></form><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>ID</th><th>Name</th><th>Party</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="c:${contracts}"><td th:text="${c.id}"></td><td th:text="${c.contractName}"></td><td th:text="${c.partyName}"></td><td th:text="${c.startDate}"></td><td th:text="${c.endDate}"></td><td th:text="${c.status}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/contracts/'+${c.id}}">Manage</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{'/api/contracts/'+${c.id}+'/documents'}">Documents</a></td></tr><tr th:if="${#lists.isEmpty(contracts)}"><td colspan="7" class="text-center">No contracts found</td></tr></tbody></table></div><div class="mt-3"><a href="/dashboard">Dashboard</a> · <a href="/students">Students</a> · <a href="/activity-logs">Activity Logs</a> · <a href="/logout">Logout</a></div></div></body></html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentMS | Profile</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #1e3a8a;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: white;
        }

        .profile-card {
            max-width: 750px;
            margin: 50px auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
            font-weight: 700;

            margin: 0 auto 15px;
        }

        .profile-header h2 {
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #64748b;
        }

        .profile-info {
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 5px;

            border-bottom: 1px solid #f1f1f1;
        }

        .info-label {
            color: #64748b;
            font-weight: 600;
        }

        .info-value {
            color: #1e293b;
            font-weight: 500;
        }

        .status-badge {
            background: #dcfce7;
            color: #15803d;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 600;
        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-mortarboard-fill"></i>

            Student Management System

        </a>

        <div>

            <a th:href="@{/dashboard}"
               class="btn btn-light me-2">

                <i class="bi bi-house-door-fill"></i>

                Dashboard

            </a>

            <a th:href="@{/logout}"
               class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- ================= PROFILE ================= -->

<div class="container">

    <div class="profile-card">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-avatar">

                <span
                    th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">

                    A

                </span>

            </div>


            <h2 th:text="${user.name}">

                User Name

            </h2>


            <p th:text="${user.email}">

                user@example.com

            </p>

        </div>


        <!-- PROFILE INFORMATION -->

        <div class="profile-info">


            <!-- ID -->

            <div class="info-row">

                <span class="info-label">

                    <i class="bi bi-person-badge"></i>

                    User ID

                </span>

                <span class="info-value"
                      th:text="${user.id}">

                    1

                </span>

            </div>


            <!-- NAME -->

            <div class="info-row">

                <span class="info-label">

                    <i class="bi bi-person"></i>

                    Full Name

                </span>

                <span class="info-value"
                      th:text="${user.name}">

                    Admin

                </span>

            </div>


            <!-- EMAIL -->

            <div class="info-row">

                <span class="info-label">

                    <i class="bi bi-envelope"></i>

                    Email

                </span>

                <span class="info-value"
                      th:text="${user.email}">

                    admin@gmail.com

                </span>

            </div>


            <!-- STATUS -->

            <div class="info-row">

                <span class="info-label">

                    <i class="bi bi-check-circle"></i>

                    Status

                </span>

                <span class="status-badge"
                      th:text="${user.status}">

                    ACTIVE

                </span>

            </div>


            <!-- CREATED DATE -->

            <div class="info-row">

                <span class="info-label">

                    <i class="bi bi-calendar"></i>

                    Account Created

                </span>

                <span class="info-value"
                      th:text="${user.createdDate}">

                    2026-08-13

                </span>

            </div>
            <div class="text-center mt-4">

    <a th:href="@{/profile/edit}"
       class="btn btn-primary">

        <i class="bi bi-pencil-square"></i>

        Update Profile

    </a>

</div>
<div class="card mt-4">

    <div class="card-body">

        <h4 class="mb-3">
            <i class="bi bi-shield-lock"></i>
            Change Password
        </h4>

        <!-- Error -->
        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <!-- Success -->
        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <form th:action="@{/profile/change-password}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Current Password
                </label>

                <input type="password"
                       name="currentPassword"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <input type="password"
                       name="newPassword"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Confirm New Password
                </label>

                <input type="password"
                       name="confirmPassword"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-key"></i>
                Change Password

            </button>

        </form>

    </div>

</div>

        </div>

    </div>

</div>


</body>

</html>
